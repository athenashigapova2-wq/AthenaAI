apiVersion: 1

datasources:
  - name: Athena JMeter InfluxDB
    uid: athena-jmeter-influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: $INFLUXDB_ORG
      defaultBucket: $INFLUXDB_BUCKET
      tlsSkipVerify: false
    secureJsonData:
      token: $INFLUXDB_TOKEN
