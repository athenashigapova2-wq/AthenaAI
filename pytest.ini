[pytest]
testpaths =
    tests/unit
    tests/integration
    tests/evals
    tests/simulation
python_files = test_*.py
addopts = -ra --strict-markers
markers =
    unit: fast deterministic checks of isolated application behavior
    integration: checks that exercise multiple in-process application components
    eval: deterministic offline quality and dataset checks
    simulation: deterministic longitudinal checks with frozen application time
    live: opt-in checks that may call external providers or remote services

