name: Live GigaChat regression

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Optional comma-separated scenario IDs, personas, or fixture names"
        required: false
        type: string
      checkpoints:
        description: "Optional comma-separated checkpoint IDs"
        required: false
        type: string
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: live-gigachat-regression
  cancel-in-progress: false

jobs:
  longitudinal-live-eval:
    name: Longitudinal live eval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ATHENA_RUN_LIVE_EVALS: "1"
      LLM_PROVIDER: gigachat
      GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
      GIGACHAT_SCOPE: GIGACHAT_API_PERS
      RAG_ENABLED: "false"
      LLM_RATE_LIMITER_ENABLED: "false"
      LLM_CIRCUIT_BREAKER_ENABLED: "false"
      ATHENA_LIVE_SCENARIOS: ${{ github.event.inputs.scenarios || '' }}
      ATHENA_LIVE_CHECKPOINTS: ${{ github.event.inputs.checkpoints || '' }}
    steps:
      - name: Check live-eval credentials
        id: credentials
        shell: bash
        run: |
          if [ -n "$GIGACHAT_AUTH_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "available=false" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "::notice::Scheduled live evaluation skipped: repository secret GIGACHAT_AUTH_KEY is not configured."
            echo "## Live GigaChat evaluation skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "The weekly run did not contact GigaChat because the repository secret \`GIGACHAT_AUTH_KEY\` is not configured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error::Repository secret GIGACHAT_AUTH_KEY is required. Add it in Settings → Secrets and variables → Actions, then rerun this workflow."
          exit 1
      - uses: actions/checkout@v6
        if: steps.credentials.outputs.available == 'true'
      - uses: actions/setup-python@v6
        if: steps.credentials.outputs.available == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install Python dependencies
        if: steps.credentials.outputs.available == 'true'
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run explicitly opted-in live evaluations
        if: steps.credentials.outputs.available == 'true'
        run: python -m pytest tests/live_evals --run-live-evals -q
