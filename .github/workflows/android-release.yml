name: Android signed release

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: Public FastAPI HTTPS origin, without a trailing path
        required: true
        type: string
      version_code:
        description: Monotonically increasing Android version code
        required: true
        type: number
      version_name:
        description: Public semantic version, for example 1.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify signed Android release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VITE_AGENT_API_URL: ${{ inputs.backend_url }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      ATHENA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ATHENA_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ATHENA_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ATHENA_VERSION_CODE: ${{ inputs.version_code }}
      ATHENA_VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Require release secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          required=(
            VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY ANDROID_KEYSTORE_BASE64
            ATHENA_ANDROID_KEYSTORE_PASSWORD ATHENA_ANDROID_KEY_ALIAS ATHENA_ANDROID_KEY_PASSWORD
          )
          for variable in "${required[@]}"; do
            if [[ -z "${!variable}" ]]; then
              echo "Required release secret/environment variable is missing: $variable" >&2
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/athena-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "ATHENA_ANDROID_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: npm ci

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build signed release APK and AAB
        run: npm run android:release

      - name: Verify release signatures
        shell: bash
        run: |
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab

      - name: Generate checksums
        shell: bash
        run: |
          sha256sum \
            android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/bundle/release/app-release.aab \
            > android-release-sha256.txt

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: athena-android-${{ inputs.version_name }}-signed
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android-release-sha256.txt
          if-no-files-found: error
          retention-days: 30
