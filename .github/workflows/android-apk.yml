name: Android debug APK

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: Public FastAPI HTTPS origin, without a trailing path
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_AGENT_API_URL: ${{ inputs.backend_url }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Require Android build secrets
        shell: bash
        run: |
          if [[ -z "$VITE_SUPABASE_URL" || -z "$VITE_SUPABASE_ANON_KEY" ]]; then
            echo "Repository secrets VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY are required." >&2
            exit 1
          fi

      - name: Install Node dependencies
        run: npm ci

      - name: Build APK against the supplied backend
        run: npm run android:apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v6
        with:
          name: athena-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
