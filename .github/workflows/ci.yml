name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend core checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Ruff
        run: python -m ruff check backend/app tests
      - name: Python type checking
        run: python -m mypy
      - name: Legacy AI surface contract
        run: python -m pytest tests/integration/test_edge_llm_contract.py -q
      - name: Observability 2.0 and evaluation experiment contract
        run: >-
          python -m pytest
          tests/unit/test_trace_persistence_privacy.py
          tests/unit/test_ai_execution_control_plane.py
          tests/unit/test_evaluation_experiments.py
          tests/integration/test_experiment_propagation.py
          tests/integration/test_migrations.py -q
      - name: Pytest core
        run: python -m pytest tests/unit tests/integration -q
      - name: Migration chain checks
        run: python -m pytest tests/integration/test_migrations.py -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript checkJs baseline
        run: npm run typecheck:ci
      - name: Selected UI tests
        run: npm run test:ui
      - name: Production build
        run: npm run build

  frontend-e2e:
    name: Browser E2E checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Critical browser flows
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  ai-offline:
    name: AI offline regressions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Offline routing and dataset evals
        run: python -m pytest tests/evals -q
      - name: Receipt and invoice OCR quality contract
        run: >-
          python -m pytest
          tests/unit/test_document_ocr_pipeline.py
          tests/evals/test_document_ocr_evaluation.py -q
      - name: Tool access boundaries
        run: python -m pytest tests/unit/test_agent_policy.py::test_tool_access_boundaries -q
      - name: Nutrition invariants and safety regression
        run: python -m pytest tests/unit/test_agent_policy.py::test_nutrition_invariants_and_safety -q
      - name: Retry, rate-limit, and circuit-breaker regressions
        run: python -m pytest tests/unit/test_resilience.py -q
      - name: Longitudinal mock scenario
        run: python -m pytest tests/simulation -q

  docker:
    name: Backend Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build FastAPI and worker image
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: athena-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
