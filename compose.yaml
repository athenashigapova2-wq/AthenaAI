x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file:
    - ./backend/.env
  environment:
    REDIS_URL: redis://redis:6379/0
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *backend
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          assert json.load(urllib.request.urlopen('http://127.0.0.1:8001/health/ready'))['status'] == 'ready'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    <<: *backend
    volumes:
      - hf-cache:/home/athena/.cache/huggingface
    command:
      - python
      - -m
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --pool=threads
      - --concurrency=4
      - --hostname=athena-worker@%h
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -m celery -A app.workers.celery_app:celery_app inspect ping
          --destination athena-worker@$$(hostname) --timeout=5 | grep -q pong
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15m

  influxdb:
    image: influxdb:2.7-alpine
    restart: unless-stopped
    env_file:
      - ./observability/.env
    ports:
      - "127.0.0.1:8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://127.0.0.1:8086"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  grafana:
    image: grafana/grafana:12.4.0
    restart: unless-stopped
    env_file:
      - ./observability/.env
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test:
        - CMD-SHELL
        - wget --spider --quiet http://127.0.0.1:3000/api/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  redis-data:
  hf-cache:
  influxdb-data:
  influxdb-config:
  grafana-data:
