[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "backend/data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["backend/app"]
ignore_missing_imports = true
follow_imports = "skip"
allow_untyped_defs = true
allow_untyped_globals = true
disable_error_code = ["import-untyped"]
exclude = ["backend/data"]

