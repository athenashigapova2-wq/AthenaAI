[tool.ruff]
target-version = "py311"
line-length = 120
src = ["backend/app", "tests"]
extend-exclude = [".venv", "backend/data"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "W",      # pycodestyle warnings
    "I",      # import sorting
    "B",      # flake8-bugbear
    "UP",     # Python syntax upgrades
    "SIM",    # simplification suggestions
    "RUF",    # Ruff-specific checks
    "ASYNC",  # async-related problems
    "C4",     # comprehension improvements
    "PIE",    # unnecessary code
    "S",      # common security mistakes
]
ignore = [
    # The product intentionally contains Russian user-facing copy. Ruff's
    # ambiguous-Unicode checks flag ordinary Cyrillic letters in that copy.
    "RUF001",
    "RUF002",
    # FastAPI dependency injection intentionally calls Depends() in defaults.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"tests/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
files = ["backend/app"]
strict = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]
exclude = ["backend/data"]

[[tool.mypy.overrides]]
module = [
    "boto3",
    "celery",
    "celery.*",
    "langchain.*",
    "langgraph.*",
    "gigachat.*",
    "numpy",
    "numpy.*",
    "pandas",
    "scipy",
    "scipy.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.coverage.run]
branch = true
source = ["backend/app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
