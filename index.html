<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <title>MacroCoach — AI Nutrition Assistant</title>
    <meta name="description" content="AI-powered nutrition assistant that tells you what to eat next to hit your daily macro goals." />
    <meta name="theme-color" content="#243B8F" />
    <style>
      /* Статический лоадер — виден сразу, до того как загрузится и выполнится JS.
         React при монтировании сам заменит содержимое #root, включая этот блок. */
      #root-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #FFF0C9;
      }
      #root-loading .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #e5e7eb;
        border-top-color: #243B8F;
        border-radius: 50%;
        animation: root-loading-spin 0.8s linear infinite;
      }
      @keyframes root-loading-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="root-loading"><div class="spinner"></div></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
